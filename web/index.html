<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f3">
  <title>智能药盒</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="desktop-frame">
    <div class="phone" id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>智能药盒</span></div>
        <button class="icon-button" id="top-add" data-action="create" aria-label="新建计划">＋</button>
      </header>
      <main id="screen" class="screen"></main>
      <nav class="bottom-nav" aria-label="主导航">
        <button data-tab="home" class="selected"><span class="nav-icon">⌂</span><span>今日</span></button>
        <button data-tab="plans"><span class="nav-icon">▤</span><span>计划</span></button>
        <button data-tab="records"><span class="nav-icon">◷</span><span>记录</span></button>
        <button data-tab="device"><span class="nav-icon">▦</span><span>药盒</span></button>
      </nav>
      <button id="assistant-toggle" class="assistant-fab" data-action="assistant-toggle" aria-label="打开用药助手" aria-expanded="false">用药助手</button>
      <div id="assistant-root"></div>
      <div id="sheet-root"></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
